global:
  resolve_timeout: 5m

route:
  group_by: ["alertname", "severity"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default"

  routes:
    - match:
        severity: critical
      receiver: "critical"
      repeat_interval: 1h

receivers:
  - name: "default"
    webhook_configs:
      - url: "http://api:8000/api/v1/notifications/alert-webhook"
        send_resolved: true

  - name: "critical"
    webhook_configs:
      - url: "http://api:8000/api/v1/notifications/alert-webhook"
        send_resolved: true
    # Ajouter email/Slack/PagerDuty ici en prod :
    # email_configs:
    #   - to: "ops@marveline.com"
    #     from: "alertmanager@marveline.com"
    #     smarthost: "smtp:25"
