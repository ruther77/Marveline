global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: "carocorp-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["api:8000"]
    # API key header pour endpoint protege
    # headers ne sont pas supportes nativement — utiliser bearer_token_file ou basic_auth
    # Pour l'instant, /metrics est accessible depuis le reseau Docker interne (localhost exempt)

  # Redis monitoring via app metrics (redis_commands_total, redis_command_duration_seconds)
  # Pas besoin de redis-exporter separé

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]
