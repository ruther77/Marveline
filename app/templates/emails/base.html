<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ subject | default(brand.name if brand else "Marveline") }}</title>
</head>
<body style="margin:0; padding:0; background-color:#f4f4f7; font-family:Arial, Helvetica, sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f7;">
    <tr>
      <td align="center" style="padding:30px 0;">
        <table role="presentation" width="600" cellspacing="0" cellpadding="0" style="background-color:#ffffff; border-radius:8px; overflow:hidden;">
          <!-- Header -->
          <tr>
            <td style="background-color:#2d3748; padding:24px 30px; text-align:center;">
              <h1 style="color:#ffffff; margin:0; font-size:24px; font-weight:bold;">{{ brand.name if brand else "Marveline" }}</h1>
              <p style="color:#a0aec0; margin:4px 0 0; font-size:13px;">Location événementielle</p>
            </td>
          </tr>
          <!-- Content -->
          <tr>
            <td style="padding:30px;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="background-color:#f7fafc; padding:20px 30px; border-top:1px solid #e2e8f0;">
              <p style="color:#718096; font-size:12px; margin:0; text-align:center;">
                {{ brand.legal_name if brand else "Marveline SAS" }} — Location événementielle<br>
                Cet email a été envoyé automatiquement, merci de ne pas y répondre.<br>
                <a href="{{ frontend_url }}" style="color:#4a90d9; text-decoration:none;">Accéder à votre espace</a>
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
