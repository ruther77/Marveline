# Requis pour le upgrade conditionnel websocket (Vite HMR + API WS)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    client_max_body_size 50M;

    # Résoudre les noms Docker dynamiquement (évite le cache DNS
    # qui casse les connexions après un rebuild de container)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_api          http://api:8000;
    set $upstream_marveline    http://frontend-marveline:80;
    set $upstream_splendid     http://frontend-splendid:80;
    set $upstream_epicerie     http://frontend-epicerie:80;
    set $upstream_restaurant   http://frontend-restaurant:80;

    # Intercepter les erreurs upstream pour afficher les pages DEVUP
    proxy_intercept_errors on;

    # ── Security headers ──────────────────────────────────────────────
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Pages d'erreur DEVUP ──────────────────────────────────────────
    error_page 403 /devup-errors/error-403.html;
    error_page 404 /devup-errors/error-404.html;
    error_page 500 /devup-errors/error-500.html;
    error_page 502 504 /devup-errors/error-502.html;
    error_page 503 /devup-errors/error-maintenance.html;

    location /devup-errors/ {
        internal;
        alias /usr/share/nginx/error-pages/;
    }

    # Maintenance manuelle : créer /tmp/maintenance pour activer
    # Supprimer le fichier pour désactiver
    set $maintenance 0;
    if (-f /tmp/maintenance) { set $maintenance 1; }

    # ── Gzip compression ─────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # ── API ───────────────────────────────────────────────────────────
    location /api/ {
        # Ne PAS intercepter les erreurs API — les réponses JSON (403 CSRF,
        # 404, 422…) doivent arriver au client telles quelles pour que le
        # mécanisme d'auto-retry CSRF du fetchClient fonctionne.
        proxy_intercept_errors off;

        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;

        # Retry sur erreur de connexion (API en restart)
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_timeout 15s;
        proxy_next_upstream_tries 3;
    }

    # ── WebSocket API ─────────────────────────────────────────────────
    location /ws/ {
        # Ne PAS intercepter les erreurs WS (403 ticket, etc.) —
        # le client fetch doit voir la réponse JSON réelle.
        proxy_intercept_errors off;

        proxy_pass $upstream_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── JWKS / OpenID ─────────────────────────────────────────────────
    location /.well-known/ {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Uploads ETL (PDFs inline dans iframe split view) ────────────
    location /uploads/etl/ {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Override server-level DENY pour permettre l'iframe same-origin
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ── Uploads ───────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass $upstream_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Epicerie ──────────────────────────────────────────────────────
    location /epicerie/ {
        proxy_pass $upstream_epicerie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Restaurant ────────────────────────────────────────────────────
    location /restaurant/ {
        proxy_pass $upstream_restaurant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Splendid (clone Marveline en marque dorée, tenant 5) ──────────
    location /splendid/ {
        proxy_pass $upstream_splendid;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
    }

    # ── Marveline (location évèn., tenant 1) ──────────────────────────
    location /marveline/ {
        if ($maintenance) { return 503; }
        proxy_pass $upstream_marveline;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header Surrogate-Control "no-store" always;
    }

    # ── Racine : redirige vers Marveline (apporte AppSelector au passage) ─
    # Garantit qu'on ne sert plus l'app Marveline depuis "/" : chaque app
    # a son namespace explicite (/marveline/, /splendid/, /epicerie/, /restaurant/).
    location = / {
        return 302 /marveline/;
    }

    # ── Catch-all (404 pour les chemins inconnus hors namespaces apps) ────
    # En dev, un fallback vers Marveline reste pratique pour les routes legacy
    # (/dashboard, /clients...) le temps de la migration. À retirer plus tard.
    location / {
        if ($maintenance) { return 503; }
        proxy_pass $upstream_marveline;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }
}
