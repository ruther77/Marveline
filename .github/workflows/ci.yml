name: CI/CD Pipeline CaroCorp

on:
  push:
    branches: [ main, develop, "feature/*" ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: "3.11"
  POETRY_VERSION: "1.8.3"

jobs:
  lint:
    name: Linting (Black, Flake8, MyPy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Black (format check)
        run: poetry run black --check app/ tests/

      - name: Run Flake8 (linting)
        run: poetry run flake8 app/ tests/

      - name: Run MyPy (type checking)
        run: poetry run mypy app/

  security:
    name: Security Scan (Bandit, Safety)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install --no-root

      - name: Run Bandit (security analysis)
        run: poetry run bandit -r app/ -ll

      - name: Run Safety (dependency vulnerabilities)
        run: poetry run safety check --json

  test:
    name: Tests (Unit, Integration, E2E)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: caro
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: CaroCorp_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: poetry install

      - name: Run unit tests
        env:
          DATABASE_URL: postgresql+psycopg2://caro:test_password@localhost:5433/CaroCorp_test
          REDIS_URL: redis://localhost:6380/0
          JWT_SECRET: test_jwt_secret_min_32_characters_long
          CSRF_SECRET: test_csrf_secret_min_32_characters_long
        run: poetry run pytest tests/unit/ -v --cov=app --cov-report=xml

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql+psycopg2://caro:test_password@localhost:5433/CaroCorp_test
          REDIS_URL: redis://localhost:6380/0
          JWT_SECRET: test_jwt_secret_min_32_characters_long
          CSRF_SECRET: test_csrf_secret_min_32_characters_long
        run: poetry run pytest tests/integration/ -v

      - name: Run E2E tests
        env:
          DATABASE_URL: postgresql+psycopg2://caro:test_password@localhost:5433/CaroCorp_test
          REDIS_URL: redis://localhost:6380/0
          JWT_SECRET: test_jwt_secret_min_32_characters_long
          CSRF_SECRET: test_csrf_secret_min_32_characters_long
        run: poetry run pytest tests/e2e/ -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-carocorp

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, security, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            carocorp/api:${{ github.sha }}
            carocorp/api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
