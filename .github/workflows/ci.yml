name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Backend — pytest ────────────────────────────────────────────────────
  backend:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: marveline
          POSTGRES_PASSWORD: marveline
          POSTGRES_DB: marveline_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis-sec:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis-cache:
        image: redis:7-alpine
        ports:
          - 6381:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://marveline:marveline@localhost:5432/marveline_test
      REDIS_SEC_URL: redis://localhost:6380/0
      REDIS_CACHE_URL: redis://localhost:6381/0
      ENVIRONMENT: test
      TRUSTED_PROXY_HEADERS: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: pip install poetry==1.8.3

      - name: Cache Poetry virtualenv
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}
          restore-keys: poetry-${{ runner.os }}-

      - name: Install dependencies
        run: poetry install --with dev

      - name: Run migrations
        run: poetry run alembic upgrade head

      - name: Run pytest
        run: poetry run pytest tests/ -v --tb=short -q

  # ── Frontend — Vitest ───────────────────────────────────────────────────
  # ── Frontend — multi-app (monorepo pnpm workspaces) ──────────────────────
  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [marveline, epicerie, restaurant]

    defaults:
      run:
        working-directory: frontend

    env:
      APP_NAME: ${{ matrix.app }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run lint
        run: pnpm --filter "@carocorp/$APP_NAME" lint

      - name: Typecheck against baseline (marveline)
        if: matrix.app == 'marveline'
        run: pnpm --filter "@carocorp/$APP_NAME" typecheck:check

      - name: Run vitest
        run: pnpm --filter "@carocorp/$APP_NAME" test:run

      - name: Build
        run: pnpm --filter "@carocorp/$APP_NAME" build
