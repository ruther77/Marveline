# Nginx reverse proxy — VPS OVH (relay-only)
# Termine TLS (Let's Encrypt) et forward vers le Synology via WireGuard tunnel
#
# Remplacer app.marveline.fr par le domaine reel (ex: app.marveline.fr)

# ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
server {
    listen 80;
    server_name app.marveline.fr;

    # ACME challenge pour Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS → WireGuard tunnel → Synology ───────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name app.marveline.fr;

    # ── TLS Let's Encrypt ─────────────────────────────────────────────────
    ssl_certificate /etc/letsencrypt/live/app.marveline.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.marveline.fr/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/app.marveline.fr/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;

    # ── Security headers ──────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 50M;

    # ── Tout forward vers le Synology via le tunnel WG ────────────────────
    # 10.0.0.2 = IP WireGuard du Synology, :8080 = nginx local
    location / {
        proxy_pass http://10.0.0.2:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }

    # ── WebSocket support ─────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://10.0.0.2:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400s;
    }
}
