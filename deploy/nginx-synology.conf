# Nginx reverse proxy — Synology DS220+
# Ecoute sur :80 (mappe sur :8080 par Docker)
# Le VPS forward le trafic HTTPS vers ce port via WireGuard

upstream api_backend {
    server api:8000 max_fails=3 fail_timeout=10s;
}

upstream frontend_marveline {
    server frontend-marveline:80;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    # ── Security headers ──────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── API backend ───────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;

        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 15s;
    }

    # ── WebSocket ─────────────────────────────────────────────────────────
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }

    # ── JWKS / OpenID ─────────────────────────────────────────────────────
    location /.well-known/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # ── Uploads ───────────────────────────────────────────────────────────
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
    }

    # ── Frontend Marveline (catch-all) ────────────────────────────────────
    location / {
        proxy_pass http://frontend_marveline;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
}
