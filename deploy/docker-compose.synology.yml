# Docker Compose — Synology DS220+ / Marveline only
# Stack complet sur le NAS, accessible via WireGuard tunnel depuis le VPS
#
# Usage :
#   cd /volume1/docker/marveline
#   docker compose -f docker-compose.synology.yml --env-file .env.prod up -d

networks:
  marveline_net:
    driver: bridge

services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    environment:
      - ENV=production
      - DEBUG=false
      - DATABASE_URL=postgresql+psycopg2://caro:${DB_PASSWORD}@db:5432/CaroCorp
      - REDIS_SEC_URL=redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
      - CORS_ORIGINS=["https://${APP_DOMAIN}"]
      - ALLOWED_HOSTS=["${APP_DOMAIN}","api","localhost"]
      - TRUSTED_PROXY_HEADERS=true
      - JWT_ISSUER=${APP_DOMAIN}
      - JWT_AUDIENCE=marveline-api
      - SMTP_HOST=${SMTP_HOST:-localhost}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_FROM=noreply@${APP_DOMAIN}
      - FRONTEND_URL=https://${APP_DOMAIN}
    env_file:
      - .env.prod
    volumes:
      - marveline_keys:/app/keys:ro
      - marveline_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis-sec:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Frontend Marveline ───────────────────────────────────────────────────────
  frontend-marveline:
    build:
      context: ./frontend
      dockerfile: Dockerfile.monorepo
      args:
        FRONTEND_NAME: marveline
        VITE_API_URL: /api/v1
        VITE_TENANT_ID: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Nginx reverse proxy local ────────────────────────────────────────────────
  # Ecoute sur :8080, le VPS forward via WG tunnel
  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx-synology.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      frontend-marveline:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CaroCorp
      POSTGRES_USER: caro
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U caro -d CaroCorp
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Redis Security (sessions, tokens, auth) ─────────────────────────────────
  redis-sec:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_SEC_PASSWORD} --appendonly yes --maxmemory 64mb
    volumes:
      - redis-sec-data:/data
    healthcheck:
      test: redis-cli -a ${REDIS_SEC_PASSWORD} ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Redis Cache (cache app, Celery broker) ───────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_CACHE_PASSWORD} --maxmemory 64mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: redis-cli -a ${REDIS_CACHE_PASSWORD} ping
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      target: production
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+psycopg2://caro:${DB_PASSWORD}@db:5432/CaroCorp
      - REDIS_SEC_URL=redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
    env_file:
      - .env.prod
    volumes:
      - marveline_keys:/app/keys:ro
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - marveline_net

  # ── Celery Beat (taches planifiees) ──────────────────────────────────────────
  celery-beat:
    build:
      context: .
      target: production
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - ENV=production
      - DATABASE_URL=postgresql+psycopg2://caro:${DB_PASSWORD}@db:5432/CaroCorp
      - REDIS_SEC_URL=redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - marveline_net

volumes:
  pgdata:
  redis-sec-data:
  redis-cache-data:
  marveline_keys:
  marveline_uploads:
