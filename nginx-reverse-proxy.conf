# Nginx reverse proxy — routing multi-app + TLS
# marveline.fr → frontend-marveline
# massacorp.fr/epicerie/ → frontend-epicerie
# massacorp.fr/restaurant/ → frontend-restaurant
# massacorp.fr/login → page aiguillage statique
# */api/ → backend API

upstream api_backend {
    server api:8000 max_fails=3 fail_timeout=10s;
}

upstream frontend_marveline {
    server frontend-marveline:80 max_fails=3 fail_timeout=10s;
}

upstream frontend_epicerie {
    server frontend-epicerie:80 max_fails=3 fail_timeout=10s;
}

upstream frontend_restaurant {
    server frontend-restaurant:80 max_fails=3 fail_timeout=10s;
}

# ── HTTP → HTTPS redirect (both domains) ────────────────────────────────────

server {
    listen 80;
    server_name marveline.fr www.marveline.fr massacorp.fr www.massacorp.fr;
    server_tokens off;

    # ACME challenge for Let's Encrypt (certbot webroot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect everything else to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── www.marveline.fr → marveline.fr (canonical redirect) ────────────────────

server {
    listen 443 ssl http2;
    server_name www.marveline.fr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/marveline.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marveline.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://marveline.fr$request_uri;
}

# ── www.massacorp.fr → massacorp.fr (canonical redirect) ────────────────────

server {
    listen 443 ssl http2;
    server_name www.massacorp.fr;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/massacorp.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massacorp.fr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://massacorp.fr$request_uri;
}

# ── marveline.fr (HTTPS) ────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name marveline.fr;
    server_tokens off;

    # TLS certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/marveline.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marveline.fr/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/marveline.fr/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS : phase 1 = 24h. Apres 1 semaine sans incident → 604800 (7j).
    # Apres 1 mois → 31536000; includeSubDomains (2 ans).
    add_header Strict-Transport-Security "max-age=86400" always;

    # Performance
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        # Ne PAS intercepter les erreurs API — les réponses JSON (403 CSRF,
        # 404, 422…) doivent arriver au client telles quelles.
        proxy_intercept_errors off;
        proxy_next_upstream error timeout http_502;
        proxy_next_upstream_timeout 15s;
        proxy_next_upstream_tries 3;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # JWKS — path précis pour éviter conflit avec ACME
    location /.well-known/jwks.json {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/openid-configuration {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME challenge (HTTPS fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Marveline
    location / {
        proxy_pass http://frontend_marveline;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── massacorp.fr (HTTPS) ────────────────────────────────────────────────────

server {
    listen 443 ssl http2;
    server_name massacorp.fr;
    server_tokens off;

    # TLS certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/massacorp.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/massacorp.fr/privkey.pem;

    # SSL hardening
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/massacorp.fr/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    # Performance
    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # API (shared)
    location /api/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # WebSocket
    location /ws/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # JWKS — massacorp.fr aussi (OAuth/OIDC)
    location /.well-known/jwks.json {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/openid-configuration {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ACME challenge (HTTPS fallback)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uploads
    location /uploads/ {
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Epicerie
    location /epicerie/ {
        proxy_pass http://frontend_epicerie;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Restaurant
    location /restaurant/ {
        proxy_pass http://frontend_restaurant;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Page aiguillage login
    location = /login {
        alias /usr/share/nginx/html/massacorp-login.html;
    }

    # Root → redirect vers login
    location = / {
        return 302 /login;
    }
}
