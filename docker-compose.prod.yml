# Docker Compose production — 3 frontends + API + DB + Redis + Nginx + Certbot

networks:
  carocorp_net:
    driver: bridge

services:
  # ── Backend ──────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      target: production
    environment:
      - DATABASE_URL=postgresql+psycopg2://caro:${DB_PASSWORD}@db:5432/CaroCorp
      - REDIS_SEC_URL=redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      - CORS_ORIGINS=["https://marveline.fr","https://massacorp.fr"]
      - ALLOWED_HOSTS=["marveline.fr","massacorp.fr","api","localhost"]
      - TRUSTED_PROXY_HEADERS=true
      - DEBUG=false
    volumes:
      - marveline_keys:/app/keys:ro
      - marveline_uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      redis-sec:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Frontend Marveline ───────────────────────────────────────────────────────
  frontend-marveline:
    build:
      context: ./frontend
      dockerfile: Dockerfile.monorepo
      args:
        FRONTEND_NAME: marveline
        VITE_TENANT_ID: "1"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Frontend Épicerie ────────────────────────────────────────────────────────
  frontend-epicerie:
    build:
      context: ./frontend
      dockerfile: Dockerfile.monorepo
      args:
        FRONTEND_NAME: epicerie
        VITE_TENANT_ID: "2"
        VITE_MASSACORP_AUTH_TENANT_ID: "2"
        VITE_MASSACORP_EPICERIE_TENANT_ID: "2"
        VITE_MASSACORP_RESTAURANT_TENANT_ID: "3"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Frontend Restaurant ──────────────────────────────────────────────────────
  frontend-restaurant:
    build:
      context: ./frontend
      dockerfile: Dockerfile.monorepo
      args:
        FRONTEND_NAME: restaurant
        VITE_TENANT_ID: "3"
        VITE_MASSACORP_AUTH_TENANT_ID: "3"
        VITE_MASSACORP_EPICERIE_TENANT_ID: "2"
        VITE_MASSACORP_RESTAURANT_TENANT_ID: "3"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-reverse-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static/massacorp-login.html:/usr/share/nginx/html/massacorp-login.html:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      frontend-marveline:
        condition: service_healthy
      frontend-epicerie:
        condition: service_healthy
      frontend-restaurant:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Certbot (Let's Encrypt) ─────────────────────────────────────────────────
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Renouvellement toutes les 12h — post-hook touche un fichier signal
    # nginx recharge via inotify ou cron séparé (voir scripts/deploy/certbot-renew.sh)
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    depends_on:
      - nginx
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: CaroCorp
      POSTGRES_USER: caro
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U caro -d CaroCorp
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Redis Security ───────────────────────────────────────────────────────────
  redis-sec:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_SEC_PASSWORD} --appendonly yes
    volumes:
      - redis-sec-data:/data
    healthcheck:
      test: redis-cli -a ${REDIS_SEC_PASSWORD} ping
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis-cache:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_CACHE_PASSWORD}
    volumes:
      - redis-cache-data:/data
    healthcheck:
      test: redis-cli -a ${REDIS_CACHE_PASSWORD} ping
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Celery Worker ────────────────────────────────────────────────────────────
  celery:
    build:
      context: .
      target: production
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - DATABASE_URL=postgresql+psycopg2://caro:${DB_PASSWORD}@db:5432/CaroCorp
      - REDIS_SEC_URL=redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
    volumes:
      - marveline_keys:/app/keys:ro
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - carocorp_net

  # ── Celery Beat (tâches planifiées) ────────────────────────────────────────
  celery-beat:
    build:
      context: .
      target: production
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    environment:
      - DATABASE_URL=postgresql+psycopg2://caro:${DB_PASSWORD}@db:5432/CaroCorp
      - REDIS_SEC_URL=redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      - REDIS_CACHE_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      - CELERY_RESULT_BACKEND=redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK || test -f /tmp/celerybeat-schedule"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - carocorp_net

volumes:
  pgdata:
  redis-sec-data:
  redis-cache-data:
  marveline_keys:
  marveline_uploads:
  certbot_conf:
  certbot_www:
