# Redis Sentinel configuration — CaroCorp HA 3-AZ (§S-10.1)
# 3 sentinelles pour quorum (2/3), réparties dans les AZ eu-west-1a/1b/1c
#
# Usage :
#   redis-sentinel /etc/redis/sentinel.conf
# ou
#   redis-server /etc/redis/sentinel.conf --sentinel

# Port d'écoute du sentinel
port 26379

# Bind uniquement sur l'interface réseau interne (pas d'exposition publique)
bind 0.0.0.0

# Daemonize en production
daemonize no

# Logs
logfile "/var/log/redis/sentinel.log"
loglevel notice

# Répertoire de travail
dir /tmp

# ── Surveiller Redis-SEC (données critiques auth) ────────────────────────────
# sentinel monitor <master-name> <host> <port> <quorum>
sentinel monitor redis-sec-master 127.0.0.1 6380 2

# Mot de passe du master (si configuré)
# sentinel auth-pass redis-sec-master <PASSWORD>

# Délai avant détermination down (millisecondes)
sentinel down-after-milliseconds redis-sec-master 5000

# Délai avant failover (millisecondes) — 45 min max selon spec §10.2 DR
sentinel failover-timeout redis-sec-master 60000

# Nombre de replicas pouvant être reconfigurés simultanément
sentinel parallel-syncs redis-sec-master 1

# ── Surveiller Redis-CACHE (cache applicatif) ────────────────────────────────
sentinel monitor redis-cache-master 127.0.0.1 6381 2

# sentinel auth-pass redis-cache-master <PASSWORD>

sentinel down-after-milliseconds redis-cache-master 10000

# Cache moins critique — failover plus tolérant
sentinel failover-timeout redis-cache-master 30000

sentinel parallel-syncs redis-cache-master 2

# ── Notifications ─────────────────────────────────────────────────────────────
# Appeler un script externe lors d'un failover (PagerDuty / webhook)
# sentinel notification-script redis-sec-master /etc/redis/notify-failover.sh

# Script exécuté après reconfiguration d'un client
# sentinel client-reconfig-script redis-sec-master /etc/redis/reconfig.sh

# ── Sécurité ─────────────────────────────────────────────────────────────────
# Désactiver les commandes dangereuses en production
# requirepass <SENTINEL_PASSWORD>
# sentinel sentinel-password <SENTINEL_PASSWORD>
