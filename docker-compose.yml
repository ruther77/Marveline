services:
  db:
    image: postgres:16
    container_name: carocorp_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CaroCorp}
      POSTGRES_USER: ${POSTGRES_USER:-caro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - carocorp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caro -d CaroCorp"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - carocorp_net

  api:
    build: .
    container_name: carocorp_api
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-CaroCorp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    command: >
      bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    networks:
      - carocorp_net

  redis:
    image: redis:7-alpine
    container_name: carocorp_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - carocorp_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - carocorp_net

  frontend:
    build: ./frontend
    container_name: carocorp_frontend
    depends_on:
      - api
    ports:
      - "3002:80"
    environment:
      - VITE_API_URL=/api/v1
    networks:
      - carocorp_net

  celery-worker:
    build: .
    container_name: carocorp_celery_worker
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-CaroCorp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD}@redis:6379/2
    volumes:
      - .:/app
    command: >
      celery -A app.tasks.celery_app:celery_app worker
      --loglevel=info
      --queues=default,reservations,invoicing,notifications
    networks:
      - carocorp_net

  wireguard-service:
    build:
      context: ../CaroCorp/wireguard-service
      dockerfile: Dockerfile
    container_name: carocorp_wireguard
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-caro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-CaroCorp}
      INTERNAL_API_KEY: ${WG_INTERNAL_API_KEY:-dev_wg_internal_key_CHANGER_EN_PROD}
      ENCRYPTION_KEY: ${WG_ENCRYPTION_KEY:-dev_encryption_key_32_bytes_min!}
      WG_BACKEND: ${WG_BACKEND:-mock}
      WG_PRIVATE_KEY: ${WG_PRIVATE_KEY:-}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_ADDRESS: ${WG_ADDRESS:-10.10.0.1/24}
      WG_ENDPOINT: ${WG_ENDPOINT:-vpn.marveline.com}
      WG_DNS: ${WG_DNS:-1.1.1.1,8.8.8.8}
      LOG_LEVEL: ${WG_LOG_LEVEL:-INFO}
    ports:
      - "8002:8002"
      - "51820:51820/udp"
    volumes:
      - ../CaroCorp/wireguard-service:/app
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/wg/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - carocorp_net

networks:
  carocorp_net:
    driver: bridge

volumes:
  carocorp_pgdata:
  carocorp_redisdata:
