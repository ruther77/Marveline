# docker-compose.yml — CaroCorp unified (dev/prod via .env)
# ENV=dev  → Vite HMR, uvicorn --reload, mailpit, flower
# ENV=prod → build statique nginx, pas de reload, pas de devtools
#
# Usage : docker compose up -d        (lit .env automatiquement)
#         docker compose down

services:
  # ════════════════════════════════════════════════════════════════════════════
  # Infrastructure
  # ════════════════════════════════════════════════════════════════════════════

  db:
    image: postgres:16
    container_name: futurproj_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marveline}
      POSTGRES_USER: ${POSTGRES_USER:-marveline}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - marveline_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marveline} -d ${POSTGRES_DB:-marveline}"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - marveline_net

  redis-sec:
    image: redis:7-alpine
    container_name: futurproj_redis_sec
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_SEC_PASSWORD:?REDIS_SEC_PASSWORD requis}
      --maxmemory-policy noeviction
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - marveline_redis_sec_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_SEC_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - marveline_net

  redis-cache:
    image: redis:7-alpine
    container_name: futurproj_redis_cache
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_CACHE_PASSWORD:?REDIS_CACHE_PASSWORD requis}
      --maxmemory-policy allkeys-lru
      --maxmemory 256mb
      --appendonly no
      --save ""
    ports:
      - "127.0.0.1:6383:6379"
    volumes:
      - marveline_redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320M
    networks:
      - marveline_net

  # ════════════════════════════════════════════════════════════════════════════
  # API Backend
  # ════════════════════════════════════════════════════════════════════════════

  api:
    build:
      context: .
      target: ${API_BUILD_TARGET:-builder}
    container_name: futurproj_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis-sec:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-marveline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marveline}
      REDIS_SEC_URL: redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    ports:
      - "8001:8000"
    volumes:
      - marveline_keys:/app/keys:ro
      - marveline_uploads:/app/uploads
      - ./app:/app/app
      - ./tests:/app/tests
      - ./scripts:/app/scripts:ro
      - ./docs/METRO:/app/docs/METRO:ro
      - ./alembic:/app/alembic:ro
    command: >
      bash -lc "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 ${UVICORN_RELOAD:+--reload}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY:-4G}
    networks:
      marveline_net:
        aliases:
          - marveline_api

  # ════════════════════════════════════════════════════════════════════════════
  # Reverse Proxy
  # ════════════════════════════════════════════════════════════════════════════

  # ════════════════════════════════════════════════════════════════════════════
  # DEVUP Health Monitor — auto-restart des services crashés
  # ════════════════════════════════════════════════════════════════════════════

  health-monitor:
    image: docker:cli
    container_name: futurproj_health_monitor
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./scripts/deploy/health-monitor-docker.sh:/monitor.sh:ro
      - ./logs:/logs
    entrypoint: ["sh", "/monitor.sh"]
    deploy:
      resources:
        limits:
          memory: 32M
    networks:
      - marveline_net

  reverse-proxy:
    image: nginx:alpine
    container_name: futurproj_reverse_proxy
    restart: unless-stopped
    # Pas de depends_on — nginx doit survivre même si les frontends sont down
    # Les pages d'erreur DEVUP s'affichent quand un upstream est indisponible
    healthcheck:
      test: ["CMD-SHELL", "nginx -t 2>/dev/null && wget -qO- http://localhost:80/ >/dev/null 2>&1 || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ports:
      - "3000:80"
    volumes:
      - ./nginx-local-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/static/error-502.html:/usr/share/nginx/error-pages/error-502.html:ro
      - ./frontend/static/error-500.html:/usr/share/nginx/error-pages/error-500.html:ro
      - ./frontend/static/error-404.html:/usr/share/nginx/error-pages/error-404.html:ro
      - ./frontend/static/error-403.html:/usr/share/nginx/error-pages/error-403.html:ro
      - ./frontend/static/error-maintenance.html:/usr/share/nginx/error-pages/error-maintenance.html:ro
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - marveline_net

  # ════════════════════════════════════════════════════════════════════════════
  # Frontends (Vite dev ou nginx statique selon FRONTEND_DOCKERFILE)
  # ════════════════════════════════════════════════════════════════════════════

  frontend-marveline:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev.monorepo}
      args:
        APP_NAME: marveline
        FRONTEND_NAME: marveline
        VITE_TENANT_ID: "1"
        VITE_MASSACORP_URL: ${MASSACORP_URL:-}
    container_name: futurproj_frontend_marveline
    restart: unless-stopped
    working_dir: /app/apps/marveline
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api/v1
      - VITE_TENANT_ID=1
      - VITE_BASE_PATH=/marveline/
      - DOCKER=true
      - PORT=80
    volumes:
      - ./frontend/tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./frontend/packages/shared:/app/packages/shared
      - ./frontend/apps/marveline:/app/apps/marveline
      - marveline_node_modules:/app/apps/marveline/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY:-512M}
    develop:
      watch:
        - action: sync
          path: ./frontend/apps/marveline/src
          target: /app/apps/marveline/src
        - action: sync
          path: ./frontend/packages/shared/src
          target: /app/packages/shared/src
    networks:
      - marveline_net

  # ───────────── frontend-splendid : clone Marveline en mode brand doré ─────────
  # Même codebase (apps/marveline), VITE_BRAND=lesplendid force identité Splendid
  frontend-splendid:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev.monorepo}
      args:
        APP_NAME: marveline
        FRONTEND_NAME: marveline
        VITE_TENANT_ID: "5"
        VITE_MASSACORP_URL: ${MASSACORP_URL:-}
    container_name: futurproj_frontend_splendid
    restart: unless-stopped
    working_dir: /app/apps/marveline
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api/v1
      - VITE_TENANT_ID=5
      - VITE_BRAND=lesplendid
      - VITE_BASE_PATH=/splendid/
      - DOCKER=true
      - PORT=80
    volumes:
      - ./frontend/tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./frontend/packages/shared:/app/packages/shared
      - ./frontend/apps/marveline:/app/apps/marveline
      - splendid_node_modules:/app/apps/marveline/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY:-512M}
    develop:
      watch:
        - action: sync
          path: ./frontend/apps/marveline/src
          target: /app/apps/marveline/src
        - action: sync
          path: ./frontend/packages/shared/src
          target: /app/packages/shared/src
    networks:
      - marveline_net

  frontend-epicerie:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev.monorepo}
      args:
        APP_NAME: epicerie
        FRONTEND_NAME: epicerie
        VITE_TENANT_ID: "2"
        VITE_MASSACORP_AUTH_TENANT_ID: ${MASSACORP_AUTH_TENANT_ID:-2}
        VITE_MASSACORP_EPICERIE_TENANT_ID: "2"
        VITE_MASSACORP_RESTAURANT_TENANT_ID: "3"
    container_name: futurproj_frontend_epicerie
    restart: unless-stopped
    working_dir: /app/apps/epicerie
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api/v1
      - VITE_TENANT_ID=2
      - DOCKER=true
      - PORT=80
    volumes:
      - ./frontend/tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./frontend/packages/shared:/app/packages/shared
      - ./frontend/apps/epicerie:/app/apps/epicerie
      - epicerie_node_modules:/app/apps/epicerie/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY:-512M}
    develop:
      watch:
        - action: sync
          path: ./frontend/apps/epicerie/src
          target: /app/apps/epicerie/src
        - action: sync
          path: ./frontend/packages/shared/src
          target: /app/packages/shared/src
    networks:
      - marveline_net

  frontend-restaurant:
    build:
      context: ./frontend
      dockerfile: ${FRONTEND_DOCKERFILE:-Dockerfile.dev.monorepo}
      args:
        APP_NAME: restaurant
        FRONTEND_NAME: restaurant
        VITE_TENANT_ID: "3"
        VITE_MASSACORP_AUTH_TENANT_ID: ${MASSACORP_AUTH_TENANT_ID:-3}
        VITE_MASSACORP_EPICERIE_TENANT_ID: "2"
        VITE_MASSACORP_RESTAURANT_TENANT_ID: "3"
    container_name: futurproj_frontend_restaurant
    restart: unless-stopped
    working_dir: /app/apps/restaurant
    depends_on:
      api:
        condition: service_healthy
    environment:
      - VITE_API_URL=/api/v1
      - VITE_TENANT_ID=3
      - DOCKER=true
      - PORT=80
    volumes:
      - ./frontend/tsconfig.base.json:/app/tsconfig.base.json:ro
      - ./frontend/packages/shared:/app/packages/shared
      - ./frontend/apps/restaurant:/app/apps/restaurant
      - restaurant_node_modules:/app/apps/restaurant/node_modules
      - shared_node_modules:/app/packages/shared/node_modules
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: ${FRONTEND_MEMORY:-512M}
    develop:
      watch:
        - action: sync
          path: ./frontend/apps/restaurant/src
          target: /app/apps/restaurant/src
        - action: sync
          path: ./frontend/packages/shared/src
          target: /app/packages/shared/src
    networks:
      - marveline_net

  # ════════════════════════════════════════════════════════════════════════════
  # Workers
  # ════════════════════════════════════════════════════════════════════════════

  celery-worker:
    build:
      context: .
      target: ${API_BUILD_TARGET:-builder}
    container_name: futurproj_celery_worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-marveline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marveline}
      REDIS_SEC_URL: redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    command: >
      watchmedo auto-restart --directory=/app/app --pattern=*.py --recursive --
      celery -A app.tasks.celery_app:celery_app worker
      --loglevel=info
      --queues=default,reservations,invoicing,notifications,etl
    volumes:
      - marveline_keys:/app/keys:ro
      - marveline_uploads:/app/uploads
      - ./app:/app/app
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline && grep -q worker /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - marveline_net

  celery-beat:
    build:
      context: .
      target: ${API_BUILD_TARGET:-builder}
    container_name: futurproj_celery_beat
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-marveline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marveline}
      REDIS_SEC_URL: redis://:${REDIS_SEC_PASSWORD}@redis-sec:6379/0
      REDIS_CACHE_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      CELERY_RESULT_BACKEND: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/2
    command: >
      watchmedo auto-restart --directory=/app/app --pattern=*.py --recursive --
      celery -A app.tasks.celery_app:celery_app beat
      --loglevel=info
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts:ro
    healthcheck:
      test: ["CMD-SHELL", "grep -q celery /proc/1/cmdline && grep -q beat /proc/1/cmdline"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
    networks:
      - marveline_net

  # ════════════════════════════════════════════════════════════════════════════
  # WireGuard VPN
  # ════════════════════════════════════════════════════════════════════════════

  wireguard-service:
    build:
      context: ./wireguard-service
      dockerfile: Dockerfile
    container_name: futurproj_wireguard
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: ${ENV:-dev}
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-marveline}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-marveline}
      INTERNAL_API_KEY: ${WG_INTERNAL_API_KEY:-dev_wg_internal_key_CHANGER_EN_PROD}
      ENCRYPTION_KEY: ${WG_ENCRYPTION_KEY:-dev_encryption_key_32_bytes_min!}
      WG_BACKEND: ${WG_BACKEND:-mock}
      WG_PRIVATE_KEY: ${WG_PRIVATE_KEY:-}
      WG_LISTEN_PORT: ${WG_LISTEN_PORT:-51820}
      WG_ADDRESS: ${WG_ADDRESS:-10.10.0.1/24}
      WG_ENDPOINT: ${WG_ENDPOINT:-vpn.marveline.com}
      WG_DNS: ${WG_DNS:-1.1.1.1,8.8.8.8}
      LOG_LEVEL: ${WG_LOG_LEVEL:-INFO}
    ports:
      - "8002:8002"
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - ./wireguard-service:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/wg/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - marveline_net

  # ════════════════════════════════════════════════════════════════════════════
  # Dev-only services (lance avec : docker compose --profile dev up -d)
  # En dev (ENV=dev), lances automatiquement via COMPOSE_PROFILES=dev dans .env
  # ════════════════════════════════════════════════════════════════════════════

  mailpit:
    image: axllent/mailpit:latest
    container_name: futurproj_mailpit
    restart: unless-stopped
    profiles: ["dev"]
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - marveline_net

  flower:
    image: mher/flower:2.0
    container_name: marveline_flower
    profiles: ["dev"]
    depends_on:
      - redis-cache
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_CACHE_PASSWORD}@redis-cache:6379/1
      FLOWER_PORT: "5555"
      FLOWER_BASIC_AUTH: ${FLOWER_USER:-admin}:${FLOWER_PASSWORD:-admin}
    ports:
      - "5555:5555"
    networks:
      - marveline_net

  # ════════════════════════════════════════════════════════════════════════════
  # Ngrok tunnel — expose Le Splendid via HTTPS public
  # Usage : docker compose --profile tunnel up ngrok -d
  # URL :   make ngrok-url   ou   curl -s http://localhost:4040/api/tunnels
  # Domaine statique : définir NGROK_DOMAIN dans .env (plans payants)
  # ════════════════════════════════════════════════════════════════════════════

  ngrok:
    image: ngrok/ngrok:latest
    container_name: futurproj_ngrok
    restart: unless-stopped
    profiles: ["tunnel"]
    command: ["http", "frontend-splendid:80", "--log", "stdout"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?NGROK_AUTHTOKEN requis — cf. .env.example}
    ports:
      - "4040:4040"
    depends_on:
      frontend-splendid:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M
    networks:
      - marveline_net

# ══════════════════════════════════════════════════════════════════════════════

networks:
  marveline_net:
    driver: bridge

volumes:
  marveline_pgdata:
  marveline_redis_sec_data:
  marveline_redis_cache_data:
  marveline_keys:
  marveline_uploads:
  marveline_node_modules:
  splendid_node_modules:
  epicerie_node_modules:
  restaurant_node_modules:
  shared_node_modules:
