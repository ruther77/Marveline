server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://js.hcaptcha.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://newassets.hcaptcha.com; img-src 'self' data: https://newassets.hcaptcha.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self' https://api.hcaptcha.com https://hcaptcha.com; frame-src https://newassets.hcaptcha.com https://hcaptcha.com" always;

    # Hide nginx version
    server_tokens off;

    location = /more {
        return 301 /plus;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        resolver 127.0.0.11 valid=10s;
        set $backend http://marveline_api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    location /uploads {
        resolver 127.0.0.11 valid=10s;
        set $backend http://marveline_api:8000;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
