<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MassaCorp — Choisir l'application</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #fafaf9;
      color: #1c1917;
      padding: 24px;
    }
    .logo { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 16px; display: flex; align-items: center; justify-content: center; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 4px; letter-spacing: -0.5px; }
    .subtitle { color: #78716c; font-size: 14px; margin-bottom: 40px; }
    .cards { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
    .card {
      width: 200px; padding: 32px 24px; border-radius: 16px; text-align: center;
      text-decoration: none; color: inherit; transition: transform 0.15s, box-shadow 0.15s;
      border: 1px solid #e7e5e4;
    }
    .card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
    .card-icon { width: 48px; height: 48px; border-radius: 12px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
    .card-title { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
    .card-desc { font-size: 12px; color: #78716c; }
    .epicerie .card-icon { background: #059669; }
    .restaurant .card-icon { background: #d97706; }
  </style>
</head>
<body>
  <div class="logo" style="background: #292524;">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
    </svg>
  </div>
  <h1>MassaCorp</h1>
  <p class="subtitle">Choisir l'application</p>

  <div class="cards">
    <a href="/epicerie/" class="card epicerie">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 0 1-8 0"/>
        </svg>
      </div>
      <div class="card-title">Épicerie</div>
      <div class="card-desc">POS, stock, fournisseurs</div>
    </a>

    <a href="/restaurant/" class="card restaurant">
      <div class="card-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 11h.01"/><path d="M11 15h.01"/><path d="M16 16h.01"/><path d="m2 16 20 6-6-20A20 20 0 0 0 2 16"/>
        </svg>
      </div>
      <div class="card-title">Restaurant</div>
      <div class="card-desc">Salle, cuisine, service</div>
    </a>
  </div>
</body>
</html>
