<!DOCTYPE html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#d940a8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Marveline</title>
    <style>
      :root {
        --brand-primary-rgb: 185 108 196;
        --brand-primary-50-rgb:  253 245 250;
        --brand-primary-100-rgb: 249 232 244;
        --brand-primary-200-rgb: 240 208 232;
        --brand-primary-300-rgb: 223 183 227;
        --brand-primary-400-rgb: 206 142 212;
        --brand-primary-500-rgb: 185 108 196;
        --brand-primary-600-rgb: 155 82 168;
        --brand-primary-700-rgb: 126 64 138;
        --brand-primary-800-rgb:  99 50 109;
        --brand-primary-900-rgb:  74 36  82;
        --brand-primary-950-rgb:  45 21  51;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Safety net brand mismatch : si le SW actif a ete installe pour un brand
      // different de la page en cours, on unregister + clear caches + reload pour
      // eviter de servir les assets de l'ancien brand.
      (function () {
        var currentBrand = document.querySelector('meta[name="brand-code"]');
        currentBrand = currentBrand ? currentBrand.getAttribute('content') : 'marveline';
        var storedBrand = null;
        try { storedBrand = localStorage.getItem('pwa-brand-code'); } catch (_) {}
        var mismatch = storedBrand && storedBrand !== currentBrand;

        // Dev (pas de registerSW) : toujours nettoyer tout SW residuel.
        // Prod (registerSW present) : nettoyer uniquement si mismatch brand.
        var isDev = !document.querySelector('script[src*="registerSW"]');
        if (isDev || mismatch) {
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
          if (window.caches) {
            caches.keys().then(function (ks) {
              ks.forEach(function (k) { caches.delete(k); });
            });
          }
        }

        // Memorise brand courant pour detection future.
        try { localStorage.setItem('pwa-brand-code', currentBrand); } catch (_) {}

        // Si mismatch detecte en prod : force un reload apres cleanup (sans boucle).
        if (mismatch && !isDev) {
          try { sessionStorage.setItem('brand-mismatch-reload', '1'); } catch (_) {}
          setTimeout(function () { window.location.reload(); }, 250);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
