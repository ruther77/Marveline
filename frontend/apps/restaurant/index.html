<!DOCTYPE html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/restaurant/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#d97706" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/restaurant/manifest.json" />
    <link rel="apple-touch-icon" href="/restaurant/icons/icon-192.png" />
    <title>Restaurant MassaCorp</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      if (!document.querySelector('script[src*="registerSW"]')) {
        if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function(rs) { rs.forEach(function(r) { r.unregister() }) });
        if (window.caches) caches.keys().then(function(ks) { ks.forEach(function(k) { caches.delete(k) }) });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
